# CI for every pull request and every push to main (docs/spec/03-architecture.md §14).
# Three independent jobs, so a failure in one doesn't hide the others:
#   checks    lint, types, i18n keys, unit tests, formatting and a production build
#   database  migrations on a fresh Postgres, pgTAP tests, schema lint, generated types drift
#   e2e       Playwright against a production build and a local Supabase stack
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch or PR cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

# An explicit bash shell adds `-o pipefail`, so a failing command in a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # next-env.d.ts and the route types are generated (and gitignored), so create them first.
      - name: Typecheck
        run: |
          npx next typegen
          npm run typecheck

      - name: i18n keys (es and en match)
        run: npm run i18n:check

      - name: Unit tests
        run: npm test

      - name: Formatting
        run: npm run format:check

      - name: Restore the Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-checks-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'messages/**', 'public/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-checks-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # Public variables are inlined at build time; placeholders are enough to prove it builds.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55421
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3100

      - name: Today route JavaScript size (NFR-PERF-5)
        run: npm run size

  database:
    name: Database
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node and the dev dependencies are needed for Prettier in the types drift check.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Same version as the `supabase` dev dependency in package.json.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0

      - name: Start Postgres (applies supabase/migrations and seed.sql)
        run: supabase db start

      - name: pgTAP tests
        run: supabase test db

      - name: Schema lint
        run: supabase db lint --level warning --fail-on error

      # Same steps as `npm run db:types`; any difference means the committed file is stale.
      - name: Generated types match the migrations
        run: |
          supabase gen types typescript --local > src/lib/supabase/database.types.ts
          npx prettier --write src/lib/supabase/database.types.ts
          if ! git diff --exit-code -- src/lib/supabase/database.types.ts; then
            echo "::error file=src/lib/supabase/database.types.ts::src/lib/supabase/database.types.ts is out of date with supabase/migrations. Run 'npm run db:types' locally (with the local database running) and commit the result."
            exit 1
          fi

  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      VAPID_SUBJECT: mailto:ci@restart.test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0

      # Only what the app and the tests use: Postgres, Auth, REST, Realtime, Mailpit and Kong.
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,storage-api,supavisor,postgres-meta

      # The local keys are throwaway, but they are masked anyway so logs never show secrets.
      - name: Configure the app for local Supabase
        run: |
          status="$(supabase status -o json)"
          api_url="$(jq -r '.API_URL // empty' <<<"$status")"
          publishable_key="$(jq -r '.PUBLISHABLE_KEY // empty' <<<"$status")"
          secret_key="$(jq -r '.SECRET_KEY // empty' <<<"$status")"
          mailpit_url="$(jq -r '.MAILPIT_URL // .INBUCKET_URL // empty' <<<"$status")"
          if [ -z "$api_url" ] || [ -z "$publishable_key" ] || [ -z "$secret_key" ] || [ -z "$mailpit_url" ]; then
            echo "::error::supabase status did not print API_URL, PUBLISHABLE_KEY, SECRET_KEY and MAILPIT_URL."
            exit 1
          fi
          echo "::add-mask::$secret_key"

          vapid="$(npx web-push generate-vapid-keys --json)"
          vapid_public="$(jq -r '.publicKey' <<<"$vapid")"
          vapid_private="$(jq -r '.privateKey' <<<"$vapid")"
          echo "::add-mask::$vapid_private"

          cron_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$cron_secret"

          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$api_url"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$publishable_key"
            echo "SUPABASE_SECRET_KEY=$secret_key"
            echo "MAILPIT_URL=$mailpit_url"
            echo "NEXT_PUBLIC_VAPID_PUBLIC_KEY=$vapid_public"
            echo "VAPID_PRIVATE_KEY=$vapid_private"
            echo "CRON_SECRET=$cron_secret"
          } >> "$GITHUB_ENV"

      - name: Restore the Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'messages/**', 'public/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Playwright starts `npm run start` on port 3100 (playwright.config.ts).
      - name: Playwright tests
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Show Supabase Auth logs
        if: failure()
        run: docker logs --tail 200 supabase_auth_restart || true
